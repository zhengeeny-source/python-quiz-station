services:
  - type: web
    name: python-quiz-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./python_quiz.db
      - key: CORS_ORIGINS
        value: https://python-quiz-web.onrender.com

  - type: web
    name: python-quiz-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://python-quiz-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
